[beeper]
# Enable Beeper Desktop API, then paste its token into this file path.
api_base = "http://127.0.0.1:23373/v1"
token_file = "~/.config/beeper-bot/token"
control_chat_id = ""
# indexed_chat_ids is an optional pin list (always index these, even if quiet).
# You usually don't need it: auto-index below covers every recently-active chat.
indexed_chat_ids = []
# Auto-index every non-noise chat active in the last N days (0 disables). This is
# the main knob for coverage — set it high for a broad index of your real chats.
auto_index_recent_days = 90
auto_index_max_chats = 400
poll_seconds = 5
sync_interval_seconds = 300
history_fetch_limit = 500
history_backfill_pages = 20
http_timeout_seconds = 30

[archive]
path = "~/.local/state/beeper-bot/archive.sqlite3"

[llm]
base_url = "http://127.0.0.1:8090/v1"
model = "gemma"
max_input_snippets = 10
max_output_tokens = 300
temperature = 0.1

# Optional off-network LLM tier. Only purposes listed here leave the LAN; everything
# that ingests chat content (answer/digest/media/memo) stays local regardless.
# The API key is read from the named env var, never stored here (for the systemd
# unit, put it in an EnvironmentFile, e.g. ~/.config/beeper-bot/env, chmod 600).
# base_url "https://api.anthropic.com" uses the native Messages API (tool use);
# any other host is treated as an OpenAI-compatible /chat/completions endpoint.
# [cloud_llm]
# base_url = "https://api.anthropic.com"
# model = "claude-opus-4-8"
# api_key_env = "ANTHROPIC_API_KEY"
# purposes = ["music"]

# The music-library chat's tool loop (control chat named "music"; requires
# "music" in [cloud_llm].purposes). Paths are for the pipeline host (venus).
# [music]
# project_root = "/home/jbfly/git/music-library-project"
# host_python = "/usr/bin/python3"
# docker_container = "music-beets"
# max_tool_iterations = 6
# max_output_tokens = 2000
# history_turns = 12

[bridge]
reply_prefix = "[BEEPER-BOT] "
max_reply_chars = 3500
max_reply_parts = 6
send_ack = true

[media]
exclude_chat_ids = []
auto_derive = true
auto_derive_per_cycle = 3

# Optional curated multi-chat digest sets. Values may be chat ids or title fragments.
# [chat_sets.neighborhood]
# display_name = "Neighborhood"
# aliases = ["neighborhood", "neighbors"]
# chats = ["Neighborhood Planning", "Building Updates"]

# Purpose-scoped control chats. The bot polls every chat listed here, each with
# its own cursor, persona, and command set. `beeper.control_chat_id` above is
# still honored as an implicit `main` chat, so you can add these incrementally.
# Make a new Beeper "note to self" chat, invite the bot's user into it, then put
# its chat id here. Mint as many as you like.
#
# persona:          a literal system directive prepended to free-text answers in
#                   this chat (empty = default assistant).
# allowed_commands: restrict which command modes this chat honors (mode names:
#                   ask, find, catchup, index, music, music-status, status, help, reindex).
#                   Empty/omitted = all commands. help/status are always allowed.
#
# [control_chats.main]
# chat_id = "!yourmainroom:beeper.local"
#
# [control_chats.translate]
# chat_id = "!yourtranslateroom:beeper.local"
# persona = "You are a European-Portuguese ↔ English translation and drafting assistant. Give the translation, then a short note on tone/idiom, then a suggested reply if asked."
#
# [control_chats.cams]
# chat_id = "!yourcamsroom:beeper.local"
# allowed_commands = ["status"]   # a quiet feed chat: ignore ad-hoc questions
#
# A control chat named "music" is special: its free text runs a cloud-LLM tool
# loop over the music-library-project scripts (see [music] + [cloud_llm] below).
# [control_chats.music]
# chat_id = "!yourmusicroom:beeper.com"
# allowed_commands = ["music", "music-status", "ask", "help", "status"]

# Outbound notifications: any homelab script can post a fire-and-forget message
# to a control chat with `beeper-bot notify "text" [--chat <name>]`. It queues the
# message; the running serve loop delivers it to the named control chat (default
# "main"). From another machine: `ssh venus beeper-bot notify "backup failed"`.

[security]
allow_web_search = false
log_raw_messages = false
